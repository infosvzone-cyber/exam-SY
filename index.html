n":304,"cat":"D","q":"Πού συναντάμε συνήθως ένα όργανο \"s-meter\";","a":["Σε μια γέφυρα στασίμων κυμάτων SWR.","Σ’ έναν πομπό .","Σ’ έναν δέκτη .","Σε μια γέφυρα αγωγιμότητας ."],"c":2},{"n":305,"cat":"D","q":"Πού συνδέεται ένα \"balun\" για να προσαρμοστεί μια κεραία διπόλου σε ένα ομοαξονικό καλώδιο 50 ohm;","a":["Μεταξύ της κεραίας και της γείωσης .","Μεταξύ του πομποδέκτη και του καλωδίου καθόδου .","Μεταξύ του καλωδίου καθόδου και της γείωσης .","Μεταξύ της κεραίας και του καλωδίου καθόδου ."],"c":3},{"n":306,"cat":"D","q":"Πριν κάνεις κλήση \"CQ\" σε μία συχνότητα που δεν ακούς τίποτα , γιατί επιπροσθέτως πρέπει να ρωτήσεις αν η συχνότητα είναι σε χρήση (is this frequency in use?);","a":["Μόνο για λόγους ευγένειας .","∆ιότι ένας σταθμός , μέρος ενός QSO, ο οποίος βρίσκεται στη ζώνη σιγής ως προς την δική σου περιοχή , μπορεί να εκπέμπει στην συχνότητα και να μην τον ακούς .","Γιατί μπορεί η συχνότητα να είναι \" κλειδωμένη \".","Απλά είναι ένας εναλλακτικός τρόπος κλήσης ."],"c":1},{"n":307,"cat":"D","q":"Πώς \" συνδέεται\" συνήθως ο πομποδέκτης με το τροφοδοτικό του ;","a":["Με έναν ειδικό \" κοτσαδόρο \".","Με ένα εύκαμπτο , διπολικό καλώδιο χρώματος κόκκινου για το (+) και μαύρου για το (-).","Με ένα ομοαξονικό καλώδιο 50 Ohm χρώματος μαύρου .","Με μία πρίζα \" σούκο \"."],"c":1},{"n":308,"cat":"D","q":"Πώς καλείτε έναν άλλο σταθμό μέσω επαναλήπτη εάν ξέρετε το διακριτικό κλήσης του ;","a":["Αρχικά λέτε \"Message to\" ή \" Μήνυμα στον \" κι έπειτα εκφωνείτε το διακριτικό κλήσης του σταθμού .","Αρχικά εκφωνείτε το διακριτικό κλήσης του σταθμού , τη συντομογραφία \"DE\" και κατόπιν αναφέρετε το διακριτικό του σταθμού σας .","Λέτε \"CQ\" τρεις φορές και κατόπιν εκφωνείτε το διακριτικό κλήσης του σταθμού .","Περιμένετε να σας καλέσει αυτός ."],"c":1},{"n":309,"cat":"D","q":"Σε κάποιον πομποδέκτη , αυξάνοντας την ένταση ήχου του μεγαφώνου (volume), πως επηρεάζεται η ισχύς του εκπεμπόμενου ηλεκτρομαγνητικού κύματος ;","a":["Μειώνεται ανάλογα .","Αυξάνεται ανάλογ ικροφώνου .","Αποκόπτει τον ήχο , όταν δεν υπάρχει σήμα ."],"c":2},{"n":342,"cat":"D","q":"Το κομβίον \"POWER\" (PWR) σε ένα πομποδέκτη :","a":["Ρυθμίζει σταδιακά ( μικρομετρικά ) την συχνότητα (receiver incremental tuning).","Ανοίγει και κλείνει τον πομποδέκτη .","Αυξομειώνει την ισχύ εξόδου εκπομπής .","Αποκόπτει τον ήχο , όταν δεν υπάρχει σήμα ."],"c":1},{"n":343,"cat":"D","q":"Το κομβίον \"RF Power\" σε ένα πομποδέκτη :","a":["Ρυθμίζει σταδιακά ( μικρομετρικά ) την συχνότητα (receiver incremental tuning).","Ανοίγει και κλείνει τον πομποδέκτη .","Αυξομειώνει την ισχύ εξόδου του πομπού .","Αποκόπτει τον ήχο , όταν δεν υπάρχει σήμα ."],"c":2}];
const root=document.getElementById('sv-quiz');if(!root||root.dataset.ready)return;root.dataset.ready='1';
let questions=[],index=0,score=0,answered=false;
const $=id=>root.querySelector('#'+id);
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function newTest(){
 // Κατανομή σύμφωνα με τη δομή εξέτασης SY: Α 20%, Β 20%, Γ 20%, Δ 40% (6+6+6+12)
 const chosen=[...shuffle(bank.filter(x=>x.cat==='A')).slice(0,6),...shuffle(bank.filter(x=>x.cat==='B')).slice(0,6),...shuffle(bank.filter(x=>x.cat==='C')).slice(0,6),...shuffle(bank.filter(x=>x.cat==='D')).slice(0,12)];
 questions=shuffle(chosen).map(src=>({q:src.q,a:src.a,c:src.c,n:src.n,img:src.img||null}));
 index=0;score=0;$('svq-result').hidden=true;$('svq-card').hidden=false;render();
}
function render(){answered=false;$('svq-count').textContent=`Ερώτηση ${index+1} από ${questions.length}`;$('svq-score').textContent=`Σωστές: ${score}`;$('svq-progress').style.width=`${index/questions.length*100}%`;$('svq-question').textContent=questions[index].q;const qi=questions[index];$('svq-image').innerHTML='';$('svq-image').hidden=!qi.img;if(qi.img){const im=document.createElement('img');im.src=qi.img;im.alt='Σχήμα της ερώτησης';$('svq-image').appendChild(im);}$('svq-feedback').textContent='';$('svq-next').disabled=true;$('svq-next').textContent=index===questions.length-1?'Αποτελέσματα':'Επόμενη ερώτηση';$('svq-answers').innerHTML='';questions[index].a.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='svq-option';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.addEventListener('click',()=>choose(i));$('svq-answers').appendChild(b);});}
function choose(choice){if(answered)return;answered=true;const q=questions[index],buttons=$('svq-answers').querySelectorAll('button');buttons.forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('svq-correct');if(i===choice&&choice!==q.c)b.classList.add('svq-wrong');});if(choice===q.c){score++;$('svq-feedback').textContent='✓ Σωστά! Μπράβο!';$('svq-feedback').style.color='#15803d';}else{$('svq-feedback').textContent='✗ Λάθος. Η σωστή απάντηση είναι: '+q.a[q.c];$('svq-feedback').style.color='#b91c1c';}$('svq-score').textContent=`Σωστές: ${score}`;$('svq-next').disabled=false;}
function finish(){$('svq-card').hidden=true;$('svq-progress').style.width='100%';const pct=Math.round(score/questions.length*100);$('svq-result').hidden=false;$('svq-result').innerHTML=`<h3>Ολοκλήρωσες το κουίζ!</h3><p style="font-size:20px;margin:10px 0">Βαθμολογία: <strong>${score} / ${questions.length}</strong></p><p>Ποσοστό επιτυχίας: <strong>${pct}%</strong></p><button type="button" class="svq-restart">Νέο τυχαίο κουίζ</button>`;$('svq-result').querySelector('button').addEventListener('click',newTest);}
$('svq-next').addEventListener('click',()=>{if(!answered)return;if(index<questions.length-1){index++;render();}else finish();});newTest();
})();
</script>
